services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codejam16-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - TZ=America/Toronto
      - ML_AGENT_URL=http://ml-agent:8000
      # transitous = live schedules (default); mock = hardcoded offline demo data
      - TRANSIT_PROVIDER=${TRANSIT_PROVIDER:-transitous}
      # Transitous requires app name, version and a contact e-mail or URL here
      - TRANSIT_USER_AGENT=${TRANSIT_USER_AGENT:-transit-day-planner/0.1 (hackathon prototype)}
    volumes:
      - ./backend/data:/root/data # saved events, places and settings
    restart: unless-stopped

  ml-agent:
    build:
      context: ./ml-agent
      dockerfile: Dockerfile
    container_name: codejam16-ml-agent
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=development
    volumes:
      - ./ml-agent/data:/app/data # learned weights survive restarts
    restart: unless-stopped
